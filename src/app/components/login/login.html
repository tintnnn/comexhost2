<main class="login-shell">
	<section class="login-card" aria-labelledby="login-title">
		<div class="brand-lockup">
			<img
				src="/image/ilalim-logo.png"
				alt="Ilalim Elementary School logo"
				class="brand-logo"
			/>
			<h1 id="login-title">Welcome Back</h1>
			<p class="role-label">{{ roleLabel }} Portal Login</p>
		</div>

		<form class="login-form" (ngSubmit)="submit()" #f="ngForm" novalidate>
			<label class="field" for="email">
				<span>Email Address</span>
				<div class="input-shell">
					<input
						id="email"
						name="email"
						type="email"
						placeholder="@gmail.com"
						autocomplete="email"
						required
						[(ngModel)]="email"
						[disabled]="submitting()"
					/>
					<span class="field-icon" aria-hidden="true">&#9993;</span>
				</div>
			</label>

			<label class="field" for="password">
				<span>Password</span>
				<div class="input-shell">
					<input
						id="password"
						name="password"
						[type]="showPassword() ? 'text' : 'password'"
						placeholder="Enter your password"
						autocomplete="current-password"
						required
						[(ngModel)]="password"
						[disabled]="submitting()"
					/>
					<button
						type="button"
						class="field-icon field-icon-btn"
						(click)="$event.preventDefault(); togglePasswordVisibility()"
						[attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
						[attr.aria-pressed]="showPassword()"
						[disabled]="submitting()"
					>
						<svg
							*ngIf="!showPassword()"
							class="eye-icon"
							viewBox="0 0 24 24"
							aria-hidden="true"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
							<circle cx="12" cy="12" r="3" />
						</svg>
						<svg
							*ngIf="showPassword()"
							class="eye-icon"
							viewBox="0 0 24 24"
							aria-hidden="true"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.06-5.94" />
							<path d="M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.86 21.86 0 0 1-2.16 3.19" />
							<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
							<line x1="1" y1="1" x2="23" y2="23" />
						</svg>
					</button>
				</div>
			</label>

			<div class="form-error" role="alert" *ngIf="errorMessage()">
				{{ errorMessage() }}
			</div>

			<div class="form-links">
				<a href="#" aria-label="Recover your password">Forgot Password?</a>
			</div>

			<button
				type="submit"
				class="primary-action"
				[disabled]="submitting() || f.invalid"
			>
				{{ submitting() ? 'Signing in...' : 'Login' }}
			</button>
		</form>
	</section>

	<section class="login-visual" aria-hidden="true">
		<img
			ngSrc="/image/loginbg.png"
			alt=""
			fill
			priority
			sizes="100vw"
			class="visual-image"
		/>

		<div class="visual-overlay"></div>
	</section>
</main>
